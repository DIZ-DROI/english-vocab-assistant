      let html = '';
      recent.forEach((r, idx) => {
        const pct = r.totalWords > 0 ? Math.round((r.correctWords / r.totalWords) * 100) : 0;
        const color = pct >= 80 ? 'text-emerald-500' : pct >= 60 ? 'text-blue-500' : pct >= 40 ? 'text-amber-500' : 'text-red-400';
        const recordId = records.length - 1 - (recent.length - 1 - idx);
        html += `<div class="bg-white rounded-2xl p-4 shadow-sm mb-2">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-slate-700">📅 ${r.date}</span>
            <span class="text-lg font-bold ${color}">${pct}%</span>
          </div>
          <div class="flex items-center gap-4 text-xs text-slate-400">
            <span>总计 ${r.totalWords}</span>
            <span class="text-emerald-500">✓ ${r.correctWords}</span>
            <span class="text-red-400">✗ ${r.wrongWords.length}</span>
          </div>
          ${r.wrongWords.length > 0 ? `<div class="mt-2 flex flex-wrap gap-1">
            ${r.wrongWords.slice(0, 8).map(w => `<span class="px-2 py-0.5 rounded-md text-xs bg-red-50 text-red-500">${escapeHtml(w.english)}</span>`).join('')}
            ${r.wrongWords.length > 8 ? `<span class="px-2 py-0.5 rounded-md text-xs bg-slate-100 text-slate-400">+${r.wrongWords.length - 8}</span>` : ''}
          </div>
          <button onclick="retryHistoryWrong(${recordId})" class="mt-2 w-full py-2 rounded-lg bg-red-50 text-red-500 text-xs font-medium hover:bg-red-100 transition-colors">
            🔄 重练这 ${r.wrongWords.length} 个错词
          </button>` : `<div class="mt-2 text-xs text-emerald-500 font-medium">🎉 全部正确！</div>`}
        </div>`;
      });

      return html;
    }

    function retryHistoryWrong(recordId) {
      const records = getPracticeRecords();
      if (recordId < 0 || recordId >= records.length) return;
      const record = records[recordId];
      const wrongWords = (record.wrongWords || []).filter(w => w.english !== 'PK模式');
      if (wrongWords.length === 0) {
        showToast('该记录没有错词', 'warning');
        return;
      }
      // Filter out PK entries
      const validWords = wrongWords.filter(w => w.chinese);
      if (validWords.length === 0) {
        showToast('该记录没有可重练的单词', 'warning');
        return;
      }
      appState.words = validWords.map(w => ({ english: w.english, chinese: w.chinese }));
      saveWords(appState.words);
      startDictation();
    }

    // ==================== RENDER MAIN ====================
    function render() {
      const app = document.getElementById('app');
      // Preserve scroll position for wordbank page
      const savedScrollY = appState.currentPage === 'wordbank' ? window.scrollY : 0;
      let pageHtml = '';
      switch (appState.currentPage) {
        case 'home': pageHtml = renderHome(); break;
        case 'dictation': pageHtml = renderDictation(); break;
        case 'results': pageHtml = renderResults(); break;
        case 'personal': pageHtml = renderPersonal(); break;
        case 'pk': pageHtml = renderPk(); break;
        case 'wordbank': pageHtml = renderWordbank(); break;
        case 'flashcard': pageHtml = renderFlashcard(); break;
        case 'videos': pageHtml = renderVideos(); break;
        case 'recite': pageHtml = renderRecite(); break;
        case 'wordmachine': pageHtml = renderWordMachine(); break;
      }
      app.innerHTML = `<div class="max-w-[480px] mx-auto min-h-screen relative">${pageHtml}${(appState.currentPage === 'videos' && appState._videoSelected) ? '' : renderBottomNav()}</div>`;

      // Restore scroll position for wordbank page
      if (appState.currentPage === 'wordbank' && savedScrollY > 0) {
        requestAnimationFrame(() => { window.scrollTo(0, savedScrollY); });
      }

      // Setup event listeners after render
      setupPageEvents();
    }

    function setupPageEvents() {
      if (appState.currentPage === 'dictation') {
        const input = document.getElementById('dictation-input');
        if (input) {
          setTimeout(() => input.focus(), 100);
          input.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              submitAnswer();
            }
            if (e.key === 'Escape') {
              e.preventDefault();
              skipWord();
            }
          };
        }
        // Global keyboard shortcuts for dictation
        document.onkeydown = (e) => {
          if (appState.currentPage !== 'dictation') return;
          if (e.key === ' ' && !e.target.closest('input')) {
            // Space (when not in input) = replay
            e.preventDefault();
            replayWord();
          }
          if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            submitAnswer();
          }
        };
        // Start timer
        startTimer();
        // Pre-warm TTS
        warmUpTTS();
        // Play word
        setTimeout(() => {
          const idx = appState.currentWordIndex;
          const wordInRound = idx % appState.words.length;
          const word = appState.words[wordInRound];
          if (word) {
            speakWord(word.english, appState.config.accent).catch(() => {});
          }
        }, 300);
      }

      if (appState.currentPage === 'personal' && personalSubTab === 'practice' && appState.exercises.length > 0) {
        const pInput = document.getElementById('practice-input');
        if (pInput) {
          setTimeout(() => pInput.focus(), 100);
          pInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              submitPractice();
            }
          };
        }
      }
    }

    // ==================== HOME PAGE ACTIONS ====================
    function switchInputMode(mode) {
      document.querySelectorAll('.input-mode-tab').forEach(el => el.classList.remove('active'));
      const btn = document.querySelector(`[data-mode="${mode}"]`);
      if (btn) btn.classList.add('active');
      document.getElementById('input-manual').style.display = mode === 'manual' ? '' : 'none';
      document.getElementById('input-paste').style.display = mode === 'paste' ? '' : 'none';
      document.getElementById('input-file').style.display = mode === 'file' ? '' : 'none';
    }

    function addWord() {
      const engInput = document.getElementById('input-english');
      const chnInput = document.getElementById('input-chinese');
      const eng = engInput.value.trim();
      const chn = chnInput.value.trim();
      if (!eng || !chn) { showToast('请输入英文单词和中文释义', 'warning'); return; }
      if (!/^[a-zA-Z\-']+$/.test(eng)) { showToast('英文单词只能包含字母、连字符和撇号', 'error'); return; }
      const existing = appState.words.find(w => w.english.toLowerCase() === eng.toLowerCase());
      if (existing) { showToast('该单词已存在', 'warning'); return; }
      appState.words.push({ english: eng, chinese: chn });
      saveWords(appState.words);
      engInput.value = '';
      chnInput.value = '';
      engInput.focus();
      render();
      showToast('已添加: ' + eng, 'success');
    }

    function addWordsFromPaste() {
      const text = document.getElementById('input-paste-area').value.trim();
      if (!text) { showToast('请粘贴单词内容', 'warning'); return; }
      const lines = text.split(/[\n\r]+/).filter(l => l.trim());
      let added = 0;
      lines.forEach(line => {
        // Try various separators
        let parts = null;
        if (line.includes('\t')) parts = line.split('\t');
        else if (line.includes('=')) parts = line.split('=');
        else if (line.includes('：')) parts = line.split('：');
        else if (line.includes(':')) parts = line.split(':');
        else if (line.includes('，')) parts = line.split('，');
        else if (line.includes(',')) parts = line.split(',');
        else parts = line.trim().split(/\s+/);

        if (parts.length >= 2) {
          const eng = parts[0].trim();
          const chn = parts.slice(1).join(' ').trim();
          if (eng && chn && /^[a-zA-Z\-']+$/.test(eng)) {
            const existing = appState.words.find(w => w.english.toLowerCase() === eng.toLowerCase());
            if (!existing) {
              appState.words.push({ english: eng, chinese: chn });
              added++;
            }
          }
        }
      });
      saveWords(appState.words);
      document.getElementById('input-paste-area').value = '';
      render();
      showToast(`成功添加 ${added} 个单词`, 'success');
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        document.getElementById('input-paste-area').value = text;
        switchInputMode('paste');
        addWordsFromPaste();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function deleteWord(index) {
      appState.words.splice(index, 1);
      saveWords(appState.words);
      render();
    }

    async function clearWords() {
      const ok = await confirmDialog('确定要清空所有单词吗？');
      if (ok) {
        appState.words = [];
        saveWords([]);
        render();
        showToast('已清空单词列表', 'success');
      }
    }

    function updateInterval(val) {
      appState.config.interval = parseInt(val);
      saveDictationConfig(appState.config);
      document.getElementById('interval-label').textContent = val + '秒';
    }

    function setAccent(accent) {
      appState.config.accent = accent;
      saveDictationConfig(appState.config);
      render();
    }

    function setRounds(rounds) {
      appState.config.rounds = rounds;
      saveDictationConfig(appState.config);
      render();
    }

    // ==================== DICTATION ACTIONS ====================
    function startDictation() {
      if (appState.words.length === 0) {
        showToast('请先添加单词', 'warning');
        return;
      }
      appState.currentWordIndex = 0;
      appState.userAnswers = [];
      appState.results = [];
      appState.markedDifficult = new Set();
      timerRemaining = appState.config.interval;
      navigateTo('dictation');
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerRemaining = appState.config.interval;
      updateCountdownDisplay();

      // Save reference to current word index at timer start
      const startIndex = appState.currentWordIndex;

      timerInterval = setInterval(() => {
        timerRemaining--;
        updateCountdownDisplay();
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          // Only auto-submit if still on the same word
          if (appState.currentWordIndex === startIndex && appState.currentPage === 'dictation') {
            autoSubmitEmpty();
          }
        }
      }, 1000);
    }

    function updateCountdownDisplay() {
      const el = document.getElementById('countdown-display');
      if (el) {
        el.textContent = timerRemaining + 's';
        const pulseHtml = timerRemaining <= 3
          ? '<span class="inline-block animate-pulse">' + timerRemaining + 's</span>'
          : timerRemaining + 's';
        el.innerHTML = pulseHtml;
        if (timerRemaining <= 3) {
          el.className = 'text-sm font-bold text-red-500 min-w-[40px] text-right';
        } else if (timerRemaining <= 5) {
          el.className = 'text-sm font-bold text-amber-500 min-w-[40px] text-right';
        } else {
          el.className = 'text-sm font-bold text-[#4F8CFF] min-w-[40px] text-right';
        }
      }
      // Vibrate on mobile when 3 seconds left
      if (timerRemaining === 3 && navigator.vibrate) {
        navigator.vibrate(50);
      }
    }

    function autoSubmitEmpty() {
      const idx = appState.currentWordIndex;
      const wordInRound = idx % appState.words.length;
      const word = appState.words[wordInRound];
      const input = document.getElementById('dictation-input');
      const answer = input ? input.value.trim() : '';
      submitWord(answer || '', word);
    }

    function submitAnswer() {
      const idx = appState.currentWordIndex;
      const wordInRound = idx % appState.words.length;
      const word = appState.words[wordInRound];
      const input = document.getElementById('dictation-input');
      const answer = input ? input.value.trim() : '';
      submitWord(answer, word);
    }

    function skipWord() {
      const idx = appState.currentWordIndex;
      const wordInRound = idx % appState.words.length;
      const word = appState.words[wordInRound];
      submitWord('', word);
    }

    function submitWord(answer, word) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      const isCorrect = answer.trim().toLowerCase() === word.english.toLowerCase();
      appState.userAnswers.push({ word, answer: answer.trim(), isCorrect });
      appState.results.push({ word, userAnswer: answer.trim(), isCorrect, timestamp: Date.now() });

      // Assistant reaction for each answer (throttled: every 3rd answer)
      if (appState.results.length % 3 === 0) {
        assistantReact(isCorrect ? 'correct' : 'wrong');
      }

      // Advance
      const total = appState.words.length * appState.config.rounds;
      appState.currentWordIndex++;

      if (appState.currentWordIndex >= total) {
        // Dictation complete
        saveResultsToWrongbook();
        assistantReact('complete');
        navigateTo('results');
      } else {
        timerRemaining = appState.config.interval;
        render();
      }
    }

    function replayWord() {
      const idx = appState.currentWordIndex;
      const wordInRound = idx % appState.words.length;
      const word = appState.words[wordInRound];
      if (word) {
        speakWord(word.english, appState.config.accent).catch(() => {});
      }
    }

    function markAsDifficult() {
      const idx = appState.currentWordIndex;
      const wordInRound = idx % appState.words.length;
      if (appState.markedDifficult.has(wordInRound)) {
        appState.markedDifficult.delete(wordInRound);
      } else {
        appState.markedDifficult.add(wordInRound);
      }
      render();
    }

    function stopDictation() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      stopSpeaking();
      if (appState.userAnswers.length > 0) {
        saveResultsToWrongbook();
      }
      navigateTo('home');
    }

    function saveResultsToWrongbook() {
      const wrongResults = appState.results.filter(r => !r.isCorrect);
      if (wrongResults.length === 0) {
        // Still save a record
        const record = {
          date: new Date().toLocaleDateString('zh-CN'),
          totalWords: appState.results.length,
          correctWords: appState.results.filter(r => r.isCorrect).length,
          wrongWords: []
        };
        const records = getPracticeRecords();
        records.push(record);
        if (records.length > 100) records.shift();
        savePracticeRecords(records);
      assistantReact('complete');
        recordDailyStat(appState.results.filter(r => r.isCorrect).length, appState.results.length);
        return;
      }

      // Save to wrongbook
      const existingWrong = getWrongWords();
      wrongResults.forEach(r => {
        const found = existingWrong.find(w => w.english.toLowerCase() === r.word.english.toLowerCase());
        if (found) {
          found.errorCount++;
          found.lastErrorTime = Date.now();
        } else {
          existingWrong.push({
            english: r.word.english,
            chinese: r.word.chinese,
            errorCount: 1,
            lastErrorTime: Date.now(),
            unit: ''
          });
        }
      });
      saveWrongWords(existingWrong);

      // Save practice record
      const record = {
        date: new Date().toLocaleDateString('zh-CN'),
        totalWords: appState.results.length,
        correctWords: appState.results.filter(r => r.isCorrect).length,
        wrongWords: wrongResults.map(r => ({
          english: r.word.english,
          chinese: r.word.chinese,
          errorCount: 1,
          lastErrorTime: Date.now(),
          unit: ''
        }))
      };
      const records = getPracticeRecords();
      records.push(record);
      if (records.length > 100) records.shift();
      savePracticeRecords(records);
      // Record daily stats for goals & trends
      const correctCount = appState.results.filter(r => r.isCorrect).length;
      recordDailyStat(correctCount, appState.results.length);
    }

    function retryWrongWords() {
      const wrongResults = appState.results.filter(r => !r.isCorrect);
      if (wrongResults.length === 0) return;
      // Get unique wrong words
      const seen = new Set();
      const uniqueWrong = [];
      wrongResults.forEach(r => {
        const key = r.word.english.toLowerCase();
        if (!seen.has(key)) { seen.add(key); uniqueWrong.push(r.word); }
      });
      appState.words = uniqueWrong;
      saveWords(appState.words);
      appState.currentWordIndex = 0;
      appState.userAnswers = [];
      appState.results = [];
      appState.markedDifficult = new Set();
      appState.config.rounds = 1;
      timerRemaining = appState.config.interval;
      navigateTo('dictation');
    }

    // ==================== PERSONAL PAGE ACTIONS ====================
    function switchPersonalTab(tab) {
      personalSubTab = tab;
      if (tab !== 'practice') {
        appState.exercises = [];
        appState.currentExerciseIndex = 0;
        appState.practiceSession = { correct: 0, wrong: 0, total: 0 };
      }
      render();
    }

    async function clearWrongbook() {
      const ok = await confirmDialog('确定要清空所有错词吗？此操作不可撤销。');
      if (ok) {
        saveWrongWords([]);
        render();
        showToast('已清空错题本', 'success');
      }
    }

    function removeWrongWord(english) {
      const wrongWords = getWrongWords();
      const filtered = wrongWords.filter(w => w.english.toLowerCase() !== english.toLowerCase());
      saveWrongWords(filtered);
      render();
      showToast('已移除', 'success');
    }

    function startPractice() {
      const wrongWords = getWrongWords();
      if (wrongWords.length === 0) return;
      appState.exercises = [];
      wrongWords.forEach(w => {
        const exs = generateExercises(w);
        appState.exercises.push(...exs);
      });
      // Shuffle all exercises
      for (let i = appState.exercises.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [appState.exercises[i], appState.exercises[j]] = [appState.exercises[j], appState.exercises[i]];
      }
      appState.currentExerciseIndex = 0;
      appState.practiceSession = { correct: 0, wrong: 0, total: 0 };
      render();
    }

    function submitPractice() {
      const input = document.getElementById('practice-input');
      const feedback = document.getElementById('practice-feedback');
      if (!input) return;
      const answer = input.value.trim();
      const ex = appState.exercises[appState.currentExerciseIndex];
      if (!ex) return;

      appState.practiceSession.total++;
      if (answer.toLowerCase() === ex.answer.toLowerCase()) {
        appState.practiceSession.correct++;
        if (feedback) feedback.innerHTML = '<span class="text-emerald-500 font-medium">✓ 正确！</span>';
      } else {
        appState.practiceSession.wrong++;
        if (feedback) feedback.innerHTML = `<span class="text-red-400 font-medium">✗ 错误！正确答案: ${escapeHtml(ex.answer)}</span>`;
      }

      appState.currentExerciseIndex++;
      if (appState.currentExerciseIndex >= appState.exercises.length) {
        setTimeout(() => finishPractice(), 800);
      } else {
        setTimeout(() => { render(); }, 600);
      }
    }

    function skipPractice() {
      const feedback = document.getElementById('practice-feedback');
      const ex = appState.exercises[appState.currentExerciseIndex];
      if (!ex) return;
      appState.practiceSession.total++;
      appState.practiceSession.wrong++;
      if (feedback) feedback.innerHTML = `<span class="text-slate-400">跳过。答案: ${escapeHtml(ex.answer)}</span>`;

      appState.currentExerciseIndex++;
      if (appState.currentExerciseIndex >= appState.exercises.length) {
        setTimeout(() => finishPractice(), 800);
      } else {
        setTimeout(() => { render(); }, 600);
      }
    }

    function finishPractice() {
      const total = appState.practiceSession.total;
      const correct = appState.practiceSession.correct;
      const wrong = appState.practiceSession.wrong;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      let emoji = '🌟';
      if (pct >= 80) emoji = '🎉';
      else if (pct >= 60) emoji = '💪';
      else emoji = '📚';

      // Save practice record
      const wrongWords = getWrongWords();
      const record = {
        date: new Date().toLocaleDateString('zh-CN'),
        totalWords: total,
        correctWords: correct,
        wrongWords: wrongWords.slice(0, 10).map(w => ({
          english: w.english, chinese: w.chinese, errorCount: w.errorCount, lastErrorTime: w.lastErrorTime, unit: w.unit || ''
        }))
      };
      const records = getPracticeRecords();
      records.push(record);
      if (records.length > 100) records.shift();
      savePracticeRecords(records);

      let html = `<div class="bg-white rounded-2xl p-6 shadow-sm text-center">
        <p class="text-4xl mb-3">${emoji}</p>
        <p class="text-lg font-bold text-slate-800 mb-1">练习完成！</p>
        <p class="text-sm text-slate-500 mb-4">正确率 ${pct}%</p>
        <div class="flex justify-center gap-4">
          ${makeRingSvg(pct, 80)}
        </div>
        <div class="flex justify-center gap-6 mt-4 text-sm">
          <span class="text-emerald-500 font-medium">✓ ${correct} 正确</span>
          <span class="text-red-400 font-medium">✗ ${wrong} 错误</span>
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="appState.exercises = []; appState.currentExerciseIndex = 0; appState.practiceSession = {correct:0,wrong:0,total:0}; render();" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm">再来一次</button>
          <button onclick="personalSubTab='wrongbook'; appState.exercises = []; appState.currentExerciseIndex = 0; appState.practiceSession = {correct:0,wrong:0,total:0}; render();" class="flex-1 py-2.5 rounded-xl bg-[#4F8CFF] text-white font-medium text-sm">返回错题本</button>
        </div>
      </div>`;

      const app = document.getElementById('app');
      const inner = app.querySelector('.max-w-\\[480px\\]');
      if (inner) {
        const contentDiv = inner.querySelector('.p-4.pb-24');
        if (contentDiv) {
          contentDiv.innerHTML = html;
        }
      }
    }

    // ==================== RENDER: WORDBANK (题库浏览) ====================
    function switchWordbankTab(tab) {
      appState.wordbankTab = tab;
      render();
    }
    function toggleGrammarTopic(el) {
      const body = el.nextElementSibling;
      if (!body) return;
      body.classList.toggle('hidden');
      const arrow = el.querySelector('.ml-auto');
      if (arrow) arrow.textContent = body.classList.contains('hidden') ? '▸' : '▾';
    }
    function renderWordbank() {
      const tab = appState.wordbankTab || 'words';
      let html = '';
      html += `<div class="flex flex-col gap-4 px-4 pb-24 pt-4 max-w-lg mx-auto">
        <div class="flex items-center justify-between">
          <button onclick="navigateTo('home')" class="text-sm text-slate-400 hover:text-slate-600">&larr; 返回</button>
          <h2 class="text-lg font-bold text-slate-800">📚 选择题库</h2>
          <span class="text-sm text-slate-400" id="wb-selected-count">${tab === 'words' ? '已选 0' : ''}</span>
        </div>
        <!-- Tab switcher -->
        <div class="flex bg-slate-100 rounded-xl p-1">
          <button onclick="switchWordbankTab('words')" class="flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'words' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">📗 单词库</button>
          <button onclick="switchWordbankTab('grammar')" class="flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'grammar' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}">📖 语法宝典</button>
        </div>`;

      if (tab === 'words') {
        // Initialize expanded units tracking
        if (!appState._wbExpandedUnits) appState._wbExpandedUnits = new Set();
        // Preserve search term from DOM before re-render
        const searchInput = document.getElementById('wb-search');
        if (searchInput && searchInput.value) {
          appState._wbSearchTerm = searchInput.value;

    function getCurrentWordSet() {
      if (!appState._wbSelected) appState._wbSelected = new Set();
      return appState._wbSelected;
    }

    function toggleWord(english, chinese) {
      const set = getCurrentWordSet();
      if (set.has(english)) {
        set.delete(english);
      } else {
        set.add(english);
      }
      // Keep track of chinese too for adding later
      if (!appState._wbMap) appState._wbMap = {};
      appState._wbMap[english] = chinese;
      render();
    }

    function selectAllUnit(grade, unitName, select) {
      const gradeData = WORD_BANK.find(g => g.grade === grade);
      if (!gradeData) return;
      const unit = gradeData.units.find(u => u.name === unitName);
      if (!unit) return;
      const set = getCurrentWordSet();
      if (!appState._wbMap) appState._wbMap = {};
      unit.words.forEach(w => {
        if (select) { set.add(w.english); } else { set.delete(w.english); }
        appState._wbMap[w.english] = w.chinese;
      });
      render();
    }

    function selectAllGrade(grade, select) {
      const gradeData = WORD_BANK.find(g => g.grade === grade);
      if (!gradeData) return;
      const set = getCurrentWordSet();
      if (!appState._wbMap) appState._wbMap = {};
      gradeData.units.forEach(unit => {
        unit.words.forEach(w => {
          if (select) { set.add(w.english); } else { set.delete(w.english); }
          appState._wbMap[w.english] = w.chinese;
        });
      });
      render();
    }

    function isUnitAllSelected(unit, currentSet) {
      return unit.words.every(w => currentSet.has(w.english));
    }

    function isGradeAllSelected(gradeData, currentSet) {
      return gradeData.units.every(unit => unit.words.every(w => currentSet.has(w.english)));
    }

    function clearWordSelection() {
      appState._wbSelected = new Set();
      appState._wbMap = {};
      render();
    }

    function addSelectedWords() {
      const set = getCurrentWordSet();
      if (set.size === 0) {
        showToast('请先选择单词', 'warning');
        return;
      }
      const existing = new Set(appState.words.map(w => w.english.toLowerCase()));
      let added = 0;
      set.forEach(english => {
        if (!existing.has(english.toLowerCase())) {
          appState.words.push({
            english: english,
            chinese: (appState._wbMap || {})[english] || ''
          });
          existing.add(english.toLowerCase());
          added++;
        }
      });
      saveWords(appState.words);
      // Also add to word machine pool
      const wmWords = [];
      set.forEach(english => {
        wmWords.push({ english: english, chinese: (appState._wbMap || {})[english] || '' });
      });
      addToWMPool(wmWords);
      appState._wbSelected = new Set();
      appState._wbMap = {};
      showToast(`已添加 ${added} 个单词` + (set.size - added > 0 ? `，${set.size - added} 个重复已跳过` : ''), 'success');
      navigateTo('home');
    }

    function addSelectedAndStart(mode) {
      const set = getCurrentWordSet();
      if (set.size === 0) {
        showToast('请先选择单词', 'warning');
        return;
      }
      const existing = new Set(appState.words.map(w => w.english.toLowerCase()));
      let added = 0;
      set.forEach(english => {
        if (!existing.has(english.toLowerCase())) {
          appState.words.push({
            english: english,
            chinese: (appState._wbMap || {})[english] || ''
          });
          existing.add(english.toLowerCase());
          added++;
        }
      });
      saveWords(appState.words);
      // Also add to word machine pool
      addToWMPool([...set].map(english => ({ english, chinese: (appState._wbMap || {})[english] || '' })));
      appState._wbSelected = new Set();
      appState._wbMap = {};

      if (mode === 'dictation') {
        if (added > 0) showToast(`已添加 ${added} 个单词，开始听写`, 'success');
        startDictation();
      } else if (mode === 'pk') {
        if (appState.words.length < 2) {
          showToast('至少需要2个单词才能开始PK', 'warning');
          navigateTo('home');
          return;
        }
        if (added > 0) showToast(`已添加 ${added} 个单词，开始PK`, 'success');
        startPk();
      }
    }

    function toggleUnitExpand(headerEl) {
      const body = headerEl.nextElementSibling;
      const arrow = headerEl.querySelector('.expand-arrow');
      const unitKey = headerEl.getAttribute('data-unit-key');
      if (body) {
        const isHidden = body.classList.contains('hidden');
        body.classList.toggle('hidden');
        if (arrow) arrow.textContent = isHidden ? '▾' : '▸';
        // Track expanded state
        if (unitKey) {
          if (!appState._wbExpandedUnits) appState._wbExpandedUnits = new Set();
          if (isHidden) {
            appState._wbExpandedUnits.add(unitKey);
          } else {
            appState._wbExpandedUnits.delete(unitKey);
          }
        }
      }
    }

    function flipFlashcard() {
      if (!appState.flashcard) return;
      appState.flashcard.flipped = !appState.flashcard.flipped;
      renderFlashcardPage();
    }

    function nextFlashcard() {
      if (!appState.flashcard || appState.flashcard.index >= appState.words.length - 1) return;
      appState.flashcard.index++;
      appState.flashcard.flipped = false;
      renderFlashcardPage();
    }

    function prevFlashcard() {
      if (!appState.flashcard || appState.flashcard.index <= 0) return;
      appState.flashcard.index--;
      appState.flashcard.flipped = false;
      renderFlashcardPage();
    }

    function shuffleFlashcards() {
      if (appState.words.length < 2) return;
      for (let i = appState.words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [appState.words[i], appState.words[j]] = [appState.words[j], appState.words[i]];
      }
      appState.flashcard = { index: 0, flipped: false, animating: false };
      saveWords(appState.words);
      showToast('已随机排序', 'success');
      renderFlashcardPage();
    }

    function resetFlashcards() {
      appState.flashcard = { index: 0, flipped: false, animating: false };
      renderFlashcardPage();
    }

    function speakFlashcardWord() {
      const word = appState.words[appState.flashcard?.index || 0];
      if (word) speakWord(word.english, appState.config.accent);
    }

    function renderFlashcardPage() {
      const app = document.getElementById('app');

      setupFlashcardKeys();

    function setupFlashcardKeys() {
      document.onkeydown = (e) => {
        if (appState.currentPage !== 'flashcard') return;
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          flipFlashcard();

        if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextFlashcard();
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevFlashcard();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          speakFlashcardWord();

    // Plan management
    function getPlanData() {
      try { return JSON.parse(localStorage.getItem('recite_plan') || '{}'); } catch(e) { return {}; }
    }
    function savePlanData(d) { localStorage.setItem('recite_plan', JSON.stringify(d)); }

    function getPlanDefaults() {
      const d = getPlanData();
      if (!d.activeBooks) d.activeBooks = [];
      if (!d.completedLessons) d.completedLessons = {}; // { 'nce1-0': true }
      if (!d.completedWords) d.completedWords = {}; // { 'word': true }
      if (!d.readPassages) d.readPassages = []; // passage IDs read
      return d;
    }

    function toggleBookInPlan(bookId) {
      const d = getPlanDefaults();
      const idx = d.activeBooks.indexOf(bookId);
      if (idx >= 0) {
        d.activeBooks.splice(idx, 1);
        // Remove completed entries for this book
        Object.keys(d.completedLessons).forEach(k => { if (k.startsWith(bookId)) delete d.completedLessons[k]; });
      } else {
        d.activeBooks.push(bookId);
        // Add book's words to WM pool
        const book = PLAN_BOOKS.find(b => b.id === bookId);
        if (book) {
          const wmWords = [];
          book.lessons.forEach(lesson => {
            lesson.words.forEach(w => {
              const parts = w.split(' ');
              const eng = parts[0];
              const chn = parts.slice(1).join(' ');
              wmWords.push({ english: eng, chinese: chn });
            });
          });
          if (typeof addToWMPool === 'function') addToWMPool(wmWords);
        }
      }
      savePlanData(d);
      render();
    }

    function toggleLessonDone(bookId, lessonIdx) {
      const d = getPlanDefaults();
      const key = bookId + '-' + lessonIdx;
      if (d.completedLessons[key]) delete d.completedLessons[key];
      else d.completedLessons[key] = true;
      savePlanData(d);
      render();
    }

    function getBookProgress(book) {
      const d = getPlanDefaults();
      const wmData = ensureWMDefaults();
      let totalWords = 0;
      const doneWordSet = new Set();
      book.lessons.forEach((lesson, i) => {
        totalWords += lesson.words.length;
        // Words from completed lessons
        if (d.completedLessons[book.id + '-' + i]) {
          lesson.words.forEach(w => doneWordSet.add(w.split(' ')[0].toLowerCase()));
        }
      });
      // Words individually learned through WM
      book.lessons.forEach(lesson => {
        lesson.words.forEach(w => {
          const eng = w.split(' ')[0].toLowerCase();
          if (wmData.history && wmData.history[eng]) doneWordSet.add(eng);
        });
      });
      const doneCount = Math.min(doneWordSet.size, totalWords);
      return { total: totalWords, done: doneCount, percent: totalWords > 0 ? Math.round(doneCount * 100 / totalWords) : 0 };
    }

    function getAllBookWords(book) {
      const words = [];
      book.lessons.forEach(lesson => {
        lesson.words.forEach(w => {
          const parts = w.split(' ');
          words.push({ english: parts[0], chinese: parts.slice(1).join(' ') });
        });
      });
      return words;
    }

      const RECITE_DATA = [
        { category: '新概念英语第二册', id: 'nce2', passages: [
          { id: 'p-nce2-01', title: 'L1 — A Private Conversation', en: `Last week I went to the theatre. I had a very good seat. The play was very interesting. I did not enjoy it. A young man and a young woman were sitting behind me. They were talking loudly. I got very angry. I could not hear the actors. I turned round. I looked at the man and the woman angrily. They did not pay any attention. In the end, I could not bear it. I turned round again. "I can't hear a word!" I said angrily. "It's none of your business," the young man said rudely. "This is a private conversation!"`, cn: '上星期我去看戏。我的座位很好，戏很有意思，但我无法欣赏。一对青年男女坐在我身后，大声说着话。我非常生气，因为我听不见演员在说什么。我转过头去怒视他们，他们毫不理睬。最后我忍无可忍，又转过去生气地说："我一个字都听不见了！"那青年粗鲁地说："不关你的事，这是私人谈话！"', vocab: 'private 私人的, conversation 谈话, theatre 剧院, seat 座位, loudly 大声地, angrily 生气地, attention 注意, bear 忍受, rudely 粗鲁地, business 事情' },
          { id: 'p-nce2-04', title: 'L4 — An Exciting Trip', en: `I have just received a letter from my brother, Tim. He is in Australia. He has been there for six months. Tim is an engineer. He is working for a big firm and he has already visited a great number of different places in Australia. He has just bought an Australian car and has gone to Alice Springs, a small town in the centre of Australia. He will soon visit Darwin. From there, he will fly to Perth. My brother has never been abroad before, so he is finding this trip very exciting.`, cn: '我刚收到兄弟蒂姆的来信。他在澳大利亚，已经待了六个月。蒂姆是工程师，在一家大公司工作，已经去过澳大利亚很多地方。他刚买了辆澳大利亚汽车，去了中部小镇艾利斯斯普林斯，很快要去达尔文，然后飞往珀斯。我兄弟从未出过国，所以觉得这次旅行非常激动人心。', vocab: 'receive 收到, engineer 工程师, firm 公司, visit 参观, abroad 出国, exciting 激动的' },
          { id: 'p-nce2-08', title: 'L8 — The Best and the Worst', en: `Joe Sanders has the most beautiful garden in our town. Nearly everybody enters for "The Nicest Garden Competition" each year, but Joe wins every time. Bill Frith's garden is larger than Joe's. Bill works harder than Joe and grows more flowers and vegetables, but Joe's garden is more interesting. He has made neat paths and has built a wooden bridge over a pool. I like gardens too, but I do not like hard work. Every year I enter for the garden competition too, and I always win a little prize for the worst garden in the town!`, cn: '乔·桑德斯拥有镇上最漂亮的花园。几乎所有人都参加"最佳花园竞赛"，但乔每次都赢。比尔·弗里思的花园比乔的大，他更努力工作，种了更多花卉蔬菜，但乔的花园更有趣。他修了整齐的小路，在池塘上建了木桥。我也喜欢花园，但不喜欢辛苦工作。每年我也参赛，总是得个"最差花园"小奖！', vocab: 'competition 竞赛, enter 参加, garden 花园, neat 整齐的, path 小路, wooden 木制的, bridge 桥, pool 池塘, prize 奖赏' },
          { id: 'p-nce2-14', title: 'L14 — Do You Speak English?', en: `I had an amusing experience last year. After I had left a small village in the south of France, I drove on to the next town. On the way, a young man waved to me. I stopped and he asked me for a lift. As soon as he had got into the car, I said good morning to him in French and he replied in the same language. Apart from a few words, I do not know any French at all. Neither of us spoke during the journey. I had nearly reached the town, when the young man suddenly said, very slowly, "Do you speak English?" As I soon learnt, he was English himself!`, cn: '去年我有个有趣的经历。离开法国南部小村庄后，我开车去下一个城镇。路上一个年轻人向我招手，我停车让他搭便车。他一上车我就用法语道早安，他也用法语回答。除了几个词，我根本不会法语。旅途中我们都没说话。快到城镇时，年轻人突然慢慢地说："你会说英语吗？"我很快就知道，他自己就是英国人！', vocab: 'amusing 有趣的, experience 经历, village 村庄, wave 挥手, lift 搭便车, reply 回答, language 语言, neither 两者都不, journey 旅行, suddenly 突然' },
          { id: 'p-nce2-20', title: 'L20 — One Man in a Boat', en: `Fishing is my favourite sport. I often fish for hours without catching anything. But this does not worry me. Some fishermen are unlucky. Instead of catching fish, they catch old boots and rubbish. I am even less lucky. I never catch anything — not even old boots. After having spent whole mornings on the river, I always go home with an empty bag. "You must give up fishing!" my friends say. "It's a waste of time." But they don't realize one important thing. I'm not really interested in fishing. I am only interested in sitting in a boat and doing nothing at all!`, cn: '钓鱼是我的最爱。我常常钓数小时一无所获，但我毫不担心。有些渔夫不走运，不是钓到鱼而是钓到旧靴子和垃圾。我更不走运——什么都钓不到，连旧靴子都没有。在河上待了整上午后，我总拎着空袋子回家。"别钓鱼了！"朋友们说，"这是浪费时间。"但他们没意识到一件事：我真正感兴趣的不是钓鱼，而是坐在船上什么也不做！', vocab: 'fishing 钓鱼, favourite 最喜欢的, catch 抓住, worry 担心, unlucky 不幸的, boot 靴子, rubbish 垃圾, empty 空的, waste 浪费, realize 意识到' },
          { id: 'p-nce2-25', title: 'L25 — Do the English Speak English?', en: `I arrived in London at last. The railway station was big, black and dark. I did not know the way to my hotel, so I asked a porter. I not only spoke English very carefully, but very clearly as well. The porter, however, could not understand me. I repeated my question several times and at last he understood. He answered me, but he spoke neither slowly nor clearly. "I am a foreigner," I said. Then he spoke slowly, but I could not understand him. My teacher never spoke English like that! The porter and I looked at each other and smiled. Then he said something and I understood it. "You'll soon learn English!" he said. I wonder. In England, each person speaks a different language. The English understand each other, but I don't understand them! Do they speak English?`, cn: '我终于到了伦敦。火车站又大又黑又暗。我不知道去酒店的路，就问搬运工。我不仅说得非常小心，而且说得非常清晰。但搬运工听不懂。我重复了几遍问题，他终于懂了。他回答了我，但说得既不慢也不清晰。"我是外国人，"我说。于是他慢慢说，但我听不懂。老师从不那样说英语！搬运工和我相视而笑。然后他说了什么我听懂了："你很快会学会英语的！"我想知道：在英格兰，每个人说不同的语言，英国人互相懂，可我不懂他们！他们说的是英语吗？', vocab: 'railway 铁路, station 车站, porter 搬运工, carefully 小心地, clearly 清晰地, repeat 重复, foreigner 外国人, wonder 想知道, language 语言' }
        ]},
        { category: '中考满分作文范文', id: 'zkzw', passages: [
          { id: 'p-zkzw-01', title: '我的梦想', en: `Everyone has a dream. My dream is to become an English teacher in the future. When I was young, I was not good at English. But my English teacher, Miss Li, encouraged me a lot. She spent her free time helping me with my pronunciation and grammar. Because of her, I began to love English. Now I am good at English and I want to help other students just like Miss Li helped me. I know it is not easy to become a good teacher. I have to study hard and read more books. I believe that as long as I make efforts, my dream will come true one day.`, cn: '每个人都有一个梦想。我的梦想是将来成为一名英语老师。小时候我英语不好，但我的英语老师李老师给了我很多鼓励。她用空余时间帮我纠正发音和语法。因为她，我开始爱上了英语。现在我英语很好，我想像李老师帮助我那样去帮助其他学生。我知道成为一名好老师不容易。我必须努力学习，多读书。我相信只要努力，有一天我的梦想会实现。', vocab: 'dream 梦想, encourage 鼓励, pronunciation 发音, grammar 语法, effort 努力' },
          { id: 'p-zkzw-02', title: '保护环境', en: `The environment is getting worse and worse. There is more pollution in the air, water and land. Many animals are in danger because humans have destroyed their homes. As middle school students, what can we do to protect the environment? First, we should save water and electricity. Turn off the tap when we brush our teeth and turn off the lights when we leave the room. Second, we should reduce the use of plastic bags and take our own bags when shopping. Third, we can plant more trees and flowers. Finally, we should spread the idea of environmental protection. If everyone does a little, our earth will become much better. Let's take action now!`, cn: '环境变得越来越糟糕。空气、水和土地中的污染更加严重。许多动物处境危险，因为人类破坏了它们的家园。作为中学生，我们能为保护环境做些什么？首先，我们要节约用水用电：刷牙时关掉水龙头，离开房间时关灯。其次，减少塑料袋的使用，购物时自带袋子。第三，多种树和花。最后，我们应该传播环保理念。如果每个人都做一点点，地球会变得更好。让我们现在就行动起来！', vocab: 'environment 环境, pollution 污染, destroy 破坏, electricity 电, reduce 减少, plastic 塑料, spread 传播, action 行动' },
          { id: 'p-zkzw-03', title: '健康饮食', en: `Healthy eating is very important for teenagers. As middle school students, we are still growing, so we need a balanced diet. First, we should eat more fruits and vegetables. They provide vitamins that our bodies need. Second, we should have breakfast every day. Many students skip breakfast to save time, but it is very unhealthy. Third, we should drink enough water and milk instead of soft drinks. Fourth, we should eat less junk food like hamburgers and chips. They may taste good but they are bad for our health. In a word, good eating habits can make us stronger and help us study better.`, cn: '健康饮食对青少年非常重要。作为中学生，我们仍在发育，需要均衡饮食。首先，多吃水果蔬菜，它们提供身体所需的维生素。其次，每天吃早饭。许多学生为省时间不吃早餐，这很不健康。第三，多喝水多喝奶，少喝软饮料。第四，少吃汉堡薯条等垃圾食品——它们好吃但对健康不利。总之，好的饮食习惯能让我们更强壮，学习更好。', vocab: 'healthy 健康的, teenager 青少年, balanced 均衡的, diet 饮食, vitamin 维生素, skip 跳过, junk food 垃圾食品, habit 习惯' }
        ]},
        { category: '英语短文速记词汇', id: 'escp', passages: [
          { id: 'p-escp-01', title: 'My Family', en: `My name is Li Ming. I have a happy family. There are four people in my family: my father, my mother, my elder sister and I. My father is a doctor. He works in a hospital. He is very busy but he always takes good care of his patients. My mother is a teacher. She teaches Chinese in a middle school. She is patient and kind. My elder sister is a university student. She is tall and beautiful. I love my family very much.`, cn: '我叫李明。我有一个幸福的家庭，共四口人：爸爸、妈妈、姐姐和我。爸爸是医生，在医院工作，他很忙但总是悉心照料病人。妈妈是老师，在中学教语文，她又耐心又善良。姐姐是大学生，又高又漂亮。我非常爱我的家人。', vocab: 'family 家庭, hospital 医院, patient 病人/耐心的, university 大学, beautiful 美丽的' },
          { id: 'p-escp-02', title: 'Sports and Health', en: `Sports are important for our health. I like basketball best. I play basketball with my friends three times a week. Playing sports not only keeps us fit but also teaches us teamwork. Last Saturday, our class had a basketball match with Class Two. We won the game! All of us were very excited. My favorite basketball player is Yao Ming. He is a great athlete. I want to be a good basketball player like him someday. Exercise makes us strong and happy. Let's do more sports!`, cn: '运动对我们的健康很重要。我最喜欢篮球，每周打三次。做运动不仅保持健康，还教给我们团队合作。上周六我们班和二班进行了篮球赛，我们赢了！大家都很兴奋。我最喜欢的篮球运动员是姚明，他是位伟大的运动员。希望有一天我能成为像他一样好的篮球选手。锻炼让我们强壮快乐，一起多运动吧！', vocab: 'health 健康, teamwork 团队合作, match 比赛, athlete 运动员, exercise 锻炼, excited 兴奋的' },
          { id: 'p-escp-03', title: 'Traveling', en: `Traveling is my favorite hobby. I have been to many places with my parents. Last summer, we went to Beijing. We visited the Great Wall, the Forbidden City and the Summer Palace. The Great Wall is really amazing. It is so long that it looks like a huge dragon lying on the mountains. We took many photos there. The food in Beijing was also very delicious, especially the Beijing Roast Duck. I learned a lot about Chinese history during this trip. I hope I can travel to more places in the future.`, cn: '旅行是我最爱的爱好。我和父母去过很多地方。去年暑假我们去了北京，参观了长城、故宫和颐和园。长城太壮观了，像一条巨龙横卧在山脉上。我们拍了很多照片。北京的食物也很美味，尤其是北京烤鸭。这趟旅行我学到了很多中国历史知识。希望将来能去更多地方旅行。', vocab: 'travel 旅行, hobby 爱好, amazing 令人惊叹的, dragon 龙, history 历史, delicious 美味的, especially 尤其' }
        ]}
      ];

      const planData = getPlanDefaults();
      const doneSet = new Set(planData.readPassages || []);
      const total = RECITE_DATA.flatMap(c => c.passages).length;
      const done = doneSet.size;

      let html = `<div class="text-xs text-slate-400 px-1">经典短文背诵朗读 · 共 ${total} 篇</div>
        <div class="w-full bg-slate-100 rounded-full h-1.5"><div class="bg-blue-500 h-1.5 rounded-full transition-all" style="width:${total>0?Math.round(done*100/total):0}%"></div></div>
        <span class="text-xs text-slate-400 text-right">已读 ${done}/${total} 篇</span>`;

      RECITE_DATA.forEach(cat => {
        html += `<div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="px-3 py-2.5 bg-slate-50 font-semibold text-sm text-slate-700">${cat.category}</div>`;
        cat.passages.forEach(p => {
          const isDone = doneSet.has(p.id);
          html += `<div class="border-t border-slate-50">
            <div class="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-slate-50" onclick="document.getElementById('rp-${p.id}').classList.toggle('hidden')">
              <span class="text-sm text-slate-700 truncate flex-1 mr-2">${isDone?'✅':'📝'} ${escapeHtml(p.title)}</span>
              <span class="text-xs text-slate-400">▸</span>
            </div>
            <div id="rp-${p.id}" class="hidden px-3 py-3 border-t border-slate-100">
              <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line mb-3">${escapeHtml(p.en)}</div>
              <div class="text-xs text-slate-500 leading-relaxed whitespace-pre-line bg-slate-50 p-2 rounded-lg mb-3">${escapeHtml(p.cn)}</div>
              <div class="flex flex-wrap gap-1 mb-3">${p.vocab.split(', ').map(v => `<span class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded">${escapeHtml(v)}</span>`).join('')}</div>
              <button onclick="markPassageRead('${p.id}')" class="w-full py-2 rounded-lg text-sm font-medium transition-colors ${isDone?'bg-emerald-100 text-emerald-600':'bg-blue-500 text-white'}">${isDone?'✅ 已读 — 点击取消':'📝 标记为已读'}</button>
            </div>
          </div>`;
        });
        html += `</div>`;
      });
      return html;
    }

    function markPassageRead(id) {
      const d = getPlanDefaults();
      if (!d.readPassages) d.readPassages = [];
      const idx = d.readPassages.indexOf(id);
      if (idx >= 0) d.readPassages.splice(idx, 1);
      else d.readPassages.push(id);
      savePlanData(d);
      render();
    }

    function toggleReciteDone(id) { markPassageRead(id); }
    function getReciteStats() {
      const d = getPlanDefaults();
      const done = (d.readPassages || []).length;
      const RECITE_DATA = [
        { passages: [{id:'p-nce2-01'},{id:'p-nce2-04'},{id:'p-nce2-08'},{id:'p-nce2-14'},{id:'p-nce2-20'},{id:'p-nce2-25'}] },
        { passages: [{id:'p-zkzw-01'},{id:'p-zkzw-02'},{id:'p-zkzw-03'}] },
        { passages: [{id:'p-escp-01'},{id:'p-escp-02'},{id:'p-escp-03'}] }
      ];
      const total = RECITE_DATA.flatMap(c => c.passages).length;
      return { done, total, percent: total > 0 ? Math.round(done * 100 / total) : 0 };
    }

    // ==================== WORD MACHINE SYSTEM ====================
    // Core: iFlytek-style vocabulary memorization with Ebbinghaus review
    function getWMData() {
      try { return JSON.parse(localStorage.getItem('wordmachine_data') || '{}'); } catch(e) { return {}; }
    }
    function saveWMData(d) { localStorage.setItem('wordmachine_data', JSON.stringify(d)); }
    function getTodayKey() { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

    // Initialize WM state
    if (!appState._wmState) appState._wmState = { step: 'idle', wordIndex: 0, correctCount: 0, totalCount: 0, userInput: '', result: '', isReview: false };

    function ensureWMDefaults() {
      const data = getWMData();
      if (!data.dailyGoal) data.dailyGoal = 20;
      if (!data.history) data.history = {}; // { word: { first: ts, reviews: [ts], stage: 0 } }
      if (!data.todayDone) data.todayDone = []; // words done today (from WORD_BANK)
      if (!data.todayDate) data.todayDate = getTodayKey();
      if (!data.todayReviewDone) data.todayReviewDone = [];
      if (!data.totalLearned) data.totalLearned = 0;
      if (!data.wordPool) data.wordPool = []; // user's selected words to learn
      if (!data.config) data.config = { showPinyin: true, autoPlay: false, reviewInterval: [1,2,4,7,15,30] };
      // Reset todayDone if new day
      if (data.todayDate !== getTodayKey()) {
        data.todayDone = [];
        data.todayReviewDone = [];
        data.todayDate = getTodayKey();
      }
      return data;
    }

    // Get words due for review today (Ebbinghaus)
    function getDueReviews(data) {
      const today = new Date(); today.setHours(0,0,0,0);
      const due = [];
      for (const [word, h] of Object.entries(data.history || {})) {
        if (h.stage >= data.config.reviewInterval.length) continue;
        const daysSinceLastReview = h.reviews.length > 0
          ? Math.floor((today.getTime() - h.reviews[h.reviews.length-1]) / 86400000)
          : Math.floor((today.getTime() - h.first) / 86400000);
        const interval = data.config.reviewInterval[h.stage] || 30;
        if (daysSinceLastReview >= interval && !(data.todayReviewDone || []).includes(word)) {
          due.push(word);
        }
      }
      // Limit to 50 reviews per day
      return due.sort(() => Math.random()-0.5).slice(0, 50);
    }

    // Get new words to learn today
    function getNewWordsForToday(data) {
      const remaining = Math.max(0, data.dailyGoal - (data.todayDone || []).length);
      if (remaining <= 0) return [];
      const learned = new Set(Object.keys(data.history || {}));
      let pool = data.wordPool || [];
      // Fallback to appState.words if pool is empty
      if (pool.length === 0 && appState.words.length > 0) {
        pool = appState.words;
      }
      const unlearned = pool.filter(w => !learned.has(w.english));
      const shuffled = unlearned.sort(() => Math.random()-0.5);
      return shuffled.slice(0, remaining);
    }

    // Record learning result
    function recordWMResult(word, correct) {
      const data = ensureWMDefaults();
      const today = new Date().getTime();
      if (!data.history[word]) {
        data.history[word] = { first: today, reviews: [], stage: 0 };
        data.totalLearned = (data.totalLearned || 0) + 1;
      }
      if (correct) {
        data.history[word].reviews.push(today);
        data.history[word].stage = Math.min((data.history[word].stage || 0) + 1, data.config.reviewInterval.length);
      }
      data.todayDone.push(word);
      saveWMData(data);
    }

    function recordWMReview(word, correct) {
      const data = ensureWMDefaults();
      if (data.history[word]) {
        if (correct) {
          data.history[word].reviews.push(new Date().getTime());
          data.history[word].stage = Math.min((data.history[word].stage || 0) + 1, data.config.reviewInterval.length);
        }
        data.todayReviewDone = [...(data.todayReviewDone || []), word];
      }
      saveWMData(data);
    }

    // Word Machine session - get today's words (new + review)
    function prepareWMSession() {
      const data = ensureWMDefaults();
      const newWords = getNewWordsForToday(data);
      const reviews = getDueReviews(data);
      const session = [];
      // Interleave: 2 new, 1 review pattern
      let ni = 0, ri = 0;
      while (ni < newWords.length || ri < reviews.length) {
        for (let i = 0; i < 2 && ni < newWords.length; i++) session.push({ word: newWords[ni++], type: 'new' });
        if (ri < reviews.length) session.push({ word: reviews[ri++], type: 'review' });
      }
      return { session, data, newWords, reviews };
    }

    // Find word info from WORD_BANK
    function findWordInfo(english) {
      for (const g of WORD_BANK) {
        for (const u of g.units) {
          for (const w of u.words) {
            if (w.english.toLowerCase() === english.toLowerCase()) {
              return { english: w.english, chinese: w.chinese, grade: g.grade, unit: u.name };
            }
          }
        }
      }
      return { english, chinese: '', grade: '', unit: '' };
    }

    // Render word machine page
    function renderWordMachine() {
      const data = ensureWMDefaults();
      const st = appState._wmState;
      const todayDone = (data.todayDone || []).length;
      const todayReview = (data.todayReviewDone || []).length;
      const dailyGoal = data.dailyGoal;

      // If idle, show the main dashboard
      if (st.step === 'idle') {
        let html = `<div class="flex flex-col gap-4 px-4 pb-24 pt-4 max-w-lg mx-auto">
          <button onclick="navigateTo('home')" class="text-sm text-slate-400 hover:text-slate-600 self-start">&larr; 返回</button>
          <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">📱 智能单词机</h2>

          </div>
          <div class="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
            <div class="flex items-center justify-between mb-4 relative">
              <span class="text-sm font-semibold text-slate-700">今日任务</span>
              <button onclick="document.getElementById('wm-goal-dropdown').classList.toggle('hidden')" class="text-xs text-blue-500">调整目标</button>

                <div class="flex gap-1 flex-wrap">${[10,15,20,25,30,40,50].map(n => `<button onclick="setWMDailyGoal(${n});document.getElementById('wm-goal-dropdown').classList.add('hidden')" class="px-2.5 py-1 rounded-lg text-xs font-medium ${dailyGoal===n?'bg-blue-500 text-white':'bg-slate-100 text-slate-600'}">${n}</button>`).join('')}</div>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="relative w-20 h-20 shrink-0">
                <svg class="w-20 h-20 -rotate-90"><circle cx="40" cy="40" r="35" fill="none" stroke="#f1f5f9" stroke-width="8"/><circle cx="40" cy="40" r="35" fill="none" stroke="#4F8CFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2*Math.PI*35}" stroke-dashoffset="${2*Math.PI*35*(1-Math.min(1,todayDone/dailyGoal))}"/></svg>
                <div class="absolute inset-0 flex items-center justify-center"><span class="text-xl font-bold text-blue-600">${todayDone}</span></div>
              </div>
              <div class="flex-1 text-left">
                <p class="text-2xl font-bold text-slate-800">${todayDone}<span class="text-slate-400 text-lg font-normal">/${dailyGoal}</span></p>
                <p class="text-xs text-slate-400">今日已完成 · 剩余${Math.max(0,dailyGoal-todayDone)}词</p>
                <div class="w-full bg-slate-100 rounded-full h-1.5 mt-2"><div class="bg-gradient-to-r from-blue-400 to-indigo-500 h-1.5 rounded-full transition-all" style="width:${Math.min(100,Math.round(todayDone/dailyGoal*100))}%"></div></div>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs">
              <div class="bg-slate-50 rounded-xl py-2"><p class="text-slate-600 font-bold">${data.totalLearned||0}</p><p class="text-slate-400">总学习</p></div>
              <div class="bg-amber-50 rounded-xl py-2"><p class="text-amber-600 font-bold">${getDueReviews(data).length}</p><p class="text-slate-400">待复习</p></div>
              <div class="bg-emerald-50 rounded-xl py-2"><p class="text-emerald-600 font-bold">${todayReview}</p><p class="text-slate-400">已复习</p></div>
            </div>
          </div>
          <button onclick="startWM()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold text-base shadow-lg shadow-blue-200 hover:shadow-xl hover:shadow-blue-300 transition-all active:scale-[0.98]">
            ${todayDone >= dailyGoal ? '今日目标已完成！开始复习巩固' : '开始背诵'} →
          </button>
          <div class="bg-white rounded-xl p-4 border border-slate-100 text-xs text-slate-500">
            <p class="font-semibold text-slate-700 mb-1">学习流程</p>
            <p>单词初记 → 例句跟读 → 拼写检测 → 复习巩固</p>
            <p class="mt-1 text-slate-400">基于艾宾浩斯遗忘曲线自动安排复习</p>
          </div>
        </div>`;
        return html;
      }

      // In learning mode
      const session = appState._wmSession;
      if (!session || st.wordIndex >= session.length) {
        // Session complete
        cancelWMTimer();
        appState._wmState = { step: 'idle' };
        return renderWordMachine();
      }

      const item = session[st.wordIndex];
      const isReview = item.type === 'review';
      // Extract word info: review items have string word, new items have {english,chinese} object
      const rawWord = item.word;
      const wordInfo = typeof rawWord === 'string' ? findWordInfo(rawWord) : { english: rawWord.english || '', chinese: rawWord.chinese || '', grade: '', unit: '' };
      const step = st.step;

      let html = `<div class="flex flex-col min-h-screen max-w-lg mx-auto bg-slate-50">
        <div class="flex items-center justify-between px-3 py-2 bg-white border-b border-slate-100 safe-area-top">
          <button onclick="exitWM()" class="text-slate-400 hover:text-slate-600 p-1">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div class="flex items-center gap-2">
            <span class="text-xs font-medium text-slate-500">${st.wordIndex+1}/${session.length}</span>
            <span class="text-xs px-1.5 py-0.5 rounded-full ${isReview?'bg-amber-100 text-amber-600':'bg-blue-100 text-blue-600'}">${isReview?'复习':'新学'}</span>
            ${st._countdown > 0 ? `<span class="text-xs font-bold text-blue-500" id="wm-countdown-timer">⏱ ${st._countdown}s</span>` : ''}
          </div>
          <button onclick="skipWMWord()" class="text-xs text-slate-400 hover:text-blue-500">跳过</button>
        </div>
        <div class="w-full bg-slate-200 h-1"><div class="bg-blue-500 h-1 transition-all" style="width:${(st.wordIndex/session.length*100)}%"></div></div>`;

      switch (step) {
        case 'learn': // Step 1: Initial learning
          const learnDict = LOCAL_DICT[wordInfo.english.toLowerCase()];
          const learnCollocations = learnDict?.collocations || [];
          const learnTips = learnDict?.tips || [];
          html += `<div class="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center overflow-y-auto">
            <span class="text-xs text-slate-400 mb-2">${isReview ? '复习词汇' : '新词学习'}</span>
            <p class="text-4xl font-bold text-slate-800 mb-3">${escapeHtml(wordInfo.english)}</p>
            <p class="text-lg text-slate-500 mb-1">${escapeHtml(wordInfo.chinese)}</p>
            <div class="flex gap-2 mb-3 text-xs text-slate-400">
              ${wordInfo.grade?`<span>${escapeHtml(wordInfo.grade)}</span>`:''}
              ${wordInfo.unit?`<span>${escapeHtml(wordInfo.unit)}</span>`:''}
            </div>
            <button onclick="cancelWMTimer();speakWord('${wordInfo.english.replace(/'/g,"\\'")}')" class="mb-4 px-4 py-2 rounded-full bg-blue-50 text-blue-600 text-sm font-medium hover:bg-blue-100 transition-colors">🔊 听发音</button>
            ${learnCollocations.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-3 text-left">
              <p class="text-xs font-semibold text-amber-600 mb-2">📎 固定搭配</p>
              ${learnCollocations.map(c => `<p class="text-xs text-slate-600 leading-relaxed mb-1">• ${escapeHtml(c)}</p>`).join('')}
            </div>` : ''}
            ${learnTips.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-4 text-left">
              <p class="text-xs font-semibold text-red-500 mb-2">💡 高频考点</p>
              ${learnTips.map(t => `<p class="text-xs text-slate-600 leading-relaxed mb-1">${escapeHtml(t)}</p>`).join('')}
            </div>` : ''}
            ${st._countdown > 0 ? `<p class="text-xs text-blue-400 mb-3">⏱ ${st._countdown}秒后自动进入例句跟读...</p>` : ''}
            <button onclick="cancelWMTimer();wmNextStep()" class="w-full max-w-xs py-3.5 rounded-2xl bg-blue-500 text-white font-bold text-base hover:bg-blue-600 transition-colors active:scale-[0.98]">记住了，下一题 →</button>
          </div>`;
          break;

        case 'sentence': // Step 2: Shadow reading with speech evaluation
          const sentDict = LOCAL_DICT[wordInfo.english.toLowerCase()];
          const sentCollocations = sentDict?.collocations || [];
          const sentTips = sentDict?.tips || [];
          const examples = sentDict?.examples || [];
          const sentence = examples.length > 0 ? examples[0] : `Please say the word "${wordInfo.english}".`;
          const speechResult = st._speechResult;
          const recStatus = st._recordingStatus || 'idle';
          const interimText = st._interimText || '';

          html += `<div class="flex-1 flex flex-col items-center px-6 py-8 text-center overflow-y-auto">
            <span class="text-xs text-slate-400 mb-2">例句跟读评测</span>
            <p class="text-2xl font-bold text-slate-800 mb-2">${escapeHtml(wordInfo.english)}</p>
            <p class="text-sm text-slate-500 mb-4">${escapeHtml(wordInfo.chinese)}</p>`;

          // Recording status indicators
          if (recStatus === 'starting') {
            html += `<div class="mb-4 px-4 py-2 rounded-full bg-yellow-50 text-yellow-600 text-sm animate-pulse">🎤 正在启动麦克风...</div>`;
          } else if (recStatus === 'recording') {
            html += `<div class="mb-4 flex items-center gap-3">
              <span class="relative flex h-4 w-4"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-4 w-4 bg-red-500"></span></span>
              <span class="text-red-500 text-sm font-medium">🔴 正在录音中，请大声跟读...</span>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4 w-full max-w-sm">
              <p class="text-sm text-slate-700 leading-relaxed">${escapeHtml(sentence)}</p>
            </div>
            ${interimText ? `<div class="w-full max-w-sm bg-blue-50 rounded-xl p-3 mb-4">
              <p class="text-xs text-blue-400 mb-1">识别结果</p>
              <p class="text-sm text-blue-700" id="wm-interim-text">${escapeHtml(interimText)}</p>
            </div>` : `<div class="w-full max-w-sm bg-slate-50 rounded-xl p-3 mb-4">
              <p class="text-xs text-slate-400">正在识别中，请朗读上方的例句...</p>
            </div>`}
            <button onclick="stopWMSpeechEvaluation()" class="w-full max-w-xs py-3.5 rounded-2xl bg-red-500 text-white font-bold text-base hover:bg-red-600 transition-colors active:scale-[0.98] mb-3">⏹ 结束录音并评分</button>`;

          } else if (recStatus === 'evaluating') {
            html += `<div class="mb-4">
              <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto mb-2"></div>
              <p class="text-blue-500 text-sm">正在分析发音，请稍候...</p>
            </div>`;

          } else if (recStatus === 'done' && speechResult) {
            // Show scoring results
            const r = speechResult;
            const scoreColor = r.totalScore >= 90 ? 'text-emerald-500' : r.totalScore >= 75 ? 'text-blue-500' : r.totalScore >= 60 ? 'text-amber-500' : 'text-red-500';
            const scoreBg = r.totalScore >= 90 ? 'from-emerald-400 to-emerald-500' : r.totalScore >= 75 ? 'from-blue-400 to-blue-500' : r.totalScore >= 60 ? 'from-amber-400 to-amber-500' : 'from-red-400 to-red-500';
            const scoreRingColor = r.totalScore >= 90 ? '#34d399' : r.totalScore >= 75 ? '#60a5fa' : r.totalScore >= 60 ? '#fbbf24' : '#f87171';

            html += `<div class="w-full max-w-sm bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-3">
              <p class="text-xs text-slate-400 mb-1">目标例句</p>
              <p class="text-sm text-slate-700 leading-relaxed">${escapeHtml(r.targetText)}</p>
            </div>
            <div class="w-full max-w-sm bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4">
              <p class="text-xs text-slate-400 mb-1">您的跟读</p>
              <p class="text-sm text-slate-700 leading-relaxed">${escapeHtml(r.userText)}</p>
            </div>

            <!-- Score Circle -->
            <div class="relative mb-4">
              <svg width="100" height="100" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="#e2e8f0" stroke-width="8"/>
                <circle cx="50" cy="50" r="42" fill="none" stroke="${scoreRingColor}" stroke-width="8"
                  stroke-dasharray="${2*Math.PI*42}" stroke-dashoffset="${2*Math.PI*42*(1-r.totalScore/100)}"
                  stroke-linecap="round" transform="rotate(-90 50 50)"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span class="text-3xl font-bold ${scoreColor}">${r.totalScore}</span>
                <span class="text-xs text-slate-400">分</span>
              </div>
            </div>
            <span class="text-sm font-bold ${scoreColor} mb-4 px-3 py-1 rounded-full ${r.totalScore>=90?'bg-emerald-50':r.totalScore>=75?'bg-blue-50':r.totalScore>=60?'bg-amber-50':'bg-red-50'}">${r.scoreLabel}</span>

            <!-- Multi-dimensional Scores -->
            <div class="w-full max-w-sm space-y-2.5 mb-4">
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 w-20 text-right">发音准确度</span>
                <div class="flex-1 bg-slate-100 rounded-full h-2"><div class="h-2 rounded-full ${r.accuracy>=80?'bg-emerald-400':r.accuracy>=50?'bg-amber-400':'bg-red-400'}" style="width:${r.accuracy}%"></div></div>
                <span class="text-xs font-medium w-8">${r.accuracy}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 w-20 text-right">重音语调</span>
                <div class="flex-1 bg-slate-100 rounded-full h-2"><div class="h-2 rounded-full ${r.stress>=80?'bg-emerald-400':r.stress>=50?'bg-amber-400':'bg-red-400'}" style="width:${r.stress}%"></div></div>
                <span class="text-xs font-medium w-8">${r.stress}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 w-20 text-right">语调流畅度</span>
                <div class="flex-1 bg-slate-100 rounded-full h-2"><div class="h-2 rounded-full ${r.fluency>=80?'bg-emerald-400':r.fluency>=50?'bg-amber-400':'bg-red-400'}" style="width:${r.fluency}%"></div></div>
                <span class="text-xs font-medium w-8">${r.fluency}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 w-20 text-right">音节完整性</span>
                <div class="flex-1 bg-slate-100 rounded-full h-2"><div class="h-2 rounded-full ${r.syllable>=80?'bg-emerald-400':r.syllable>=50?'bg-amber-400':'bg-red-400'}" style="width:${r.syllable}%"></div></div>
                <span class="text-xs font-medium w-8">${r.syllable}</span>
              </div>
            </div>

            <!-- Error Annotations -->
            ${r.errors && r.errors.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-red-100 mb-3 text-left">
              <p class="text-xs font-semibold text-red-500 mb-2">📋 发音偏差标注</p>
              ${r.errors.map(e => `<p class="text-xs leading-relaxed mb-1">
                <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium mr-1 ${e.type==='miss'?'bg-red-100 text-red-600':e.type==='fuzzy'?'bg-amber-100 text-amber-600':'bg-purple-100 text-purple-600'}">${e.type==='miss'?'遗漏':e.type==='fuzzy'?'偏差':'多余'}</span>
                ${escapeHtml(e.text)}
              </p>`).join('')}
            </div>` : ''}

            <!-- Suggestions -->
            ${r.suggestions && r.suggestions.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-4 text-left">
              <p class="text-xs font-semibold text-blue-600 mb-2">💡 优化建议</p>
              ${r.suggestions.map(s => `<p class="text-xs text-slate-600 leading-relaxed mb-1">• ${escapeHtml(s)}</p>`).join('')}
            </div>` : ''}

            <button onclick="cancelWMTimer();wmNextStep()" class="w-full max-w-xs py-3.5 rounded-2xl bg-blue-500 text-white font-bold text-base hover:bg-blue-600 transition-colors active:scale-[0.98]">继续下一题 →</button>`;

          } else {
            // Idle state - show recording prompt
            html += `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4 w-full max-w-sm">
              <p class="text-sm text-slate-700 leading-relaxed">${escapeHtml(sentence)}</p>
            </div>
            <button onclick="cancelWMTimer();speakWord('${wordInfo.english.replace(/'/g,"\\'")}')" class="mb-4 px-4 py-2 rounded-full bg-blue-50 text-blue-600 text-sm font-medium">🔊 听原声</button>
            ${sentCollocations.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-3 text-left">
              <p class="text-xs font-semibold text-amber-600 mb-2">📎 固定搭配</p>
              ${sentCollocations.map(c => `<p class="text-xs text-slate-600 leading-relaxed mb-1">• ${escapeHtml(c)}</p>`).join('')}
            </div>` : ''}
            ${sentTips.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-3 text-left">
              <p class="text-xs font-semibold text-red-500 mb-2">💡 高频考点</p>
              ${sentTips.map(t => `<p class="text-xs text-slate-600 leading-relaxed mb-1">${escapeHtml(t)}</p>`).join('')}
            </div>` : ''}
            ${st._countdown > 0 ? `<p class="text-xs text-blue-400 mb-3">⏱ ${st._countdown}秒后自动进入拼写检测...</p>` : ''}
            ${isWMSpeechSupported() ? `
            <button onclick="startWMSpeechEvaluation()" class="w-full max-w-xs py-3.5 rounded-2xl bg-gradient-to-r from-red-400 to-rose-500 text-white font-bold text-base hover:from-red-500 hover:to-rose-600 transition-colors active:scale-[0.98] mb-3 shadow-lg shadow-red-200">
              🎤 开始跟读录音
            </button>` : ''}
            <button onclick="cancelWMTimer();wmNextStep()" class="w-full max-w-xs py-3.5 rounded-2xl bg-blue-500 text-white font-bold text-base hover:bg-blue-600 transition-colors active:scale-[0.98]">跳过跟读，继续 →</button>
          </div>`;
          }
          break;

        case 'spell': // Step 3: Spelling test
          const hasResult = !!st.result;
          const inputVal = st.userInput || '';
          html += `<div class="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center">
            <span class="text-xs text-slate-400 mb-2">拼写检测</span>
            <p class="text-lg text-slate-600 mb-1">请拼写以下单词</p>
            <p class="text-xl font-bold text-slate-800 mb-6">"${escapeHtml(wordInfo.chinese)}"</p>
            <input id="wm-spell-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="输入英文单词"
              ${hasResult ? `value="${escapeHtml(inputVal)}" readonly` : ''}
              class="w-full max-w-xs px-4 py-3 rounded-xl border-2 text-center text-lg focus:outline-none ${hasResult ? (st.result==='correct'?'border-emerald-300 bg-emerald-50 text-emerald-700':'border-red-300 bg-red-50 text-red-500 line-through') : 'border-slate-200 focus:border-blue-400'}"
              onkeydown="if(event.key==='Enter')wmCheckSpell()">
            ${st.result ? `<p class="mt-2 text-sm ${st.result==='correct'?'text-emerald-500':'text-red-500'}">${st.result==='correct'?'✅ 拼写正确！':'❌ 正确答案：<b>'+escapeHtml(wordInfo.english)+'</b>'}</p>` : ''}
            <button onclick="wmCheckSpell()" class="w-full max-w-xs py-3.5 rounded-2xl ${hasResult?'bg-emerald-500 hover:bg-emerald-600':'bg-blue-500 hover:bg-blue-600'} text-white font-bold text-base mt-4 transition-colors active:scale-[0.98]">${st.result?'继续 →':'提交检查'}</button>
          </div>`;
          break;

        case 'review': // Step 4: Quick review
          const revDict = LOCAL_DICT[wordInfo.english.toLowerCase()];
          const revCollocations = revDict?.collocations || [];
          const revTips = revDict?.tips || [];
          html += `<div class="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center overflow-y-auto">
            <span class="text-xs text-slate-400 mb-2">复习巩固</span>
            <p class="text-3xl font-bold text-slate-800 mb-3">${escapeHtml(wordInfo.english)}</p>
            <p class="text-base text-slate-500 mb-3">${escapeHtml(wordInfo.chinese)}</p>
            <button onclick="cancelWMTimer();speakWord('${wordInfo.english.replace(/'/g,"\\'")}')" class="mb-4 px-4 py-2 rounded-full bg-blue-50 text-blue-600 text-sm font-medium">🔊 听发音</button>
            ${revCollocations.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-3 text-left">
              <p class="text-xs font-semibold text-amber-600 mb-2">📎 固定搭配</p>
              ${revCollocations.map(c => `<p class="text-xs text-slate-600 leading-relaxed mb-1">• ${escapeHtml(c)}</p>`).join('')}
            </div>` : ''}
            ${revTips.length > 0 ? `
            <div class="w-full max-w-sm bg-white rounded-xl p-3 shadow-sm border border-slate-100 mb-4 text-left">
              <p class="text-xs font-semibold text-red-500 mb-2">💡 高频考点</p>
              ${revTips.map(t => `<p class="text-xs text-slate-600 leading-relaxed mb-1">${escapeHtml(t)}</p>`).join('')}
            </div>` : ''}
            ${st._countdown > 0 ? `<p class="text-xs text-blue-400 mb-3">⏱ ${st._countdown}秒后自动进入下一个单词...</p>` : ''}
            <div class="flex gap-3 mb-4">
              <button onclick="cancelWMTimer();wmRateWord(1)" class="px-6 py-3 rounded-xl bg-red-50 text-red-600 text-sm font-medium hover:bg-red-100 transition-colors">😰 忘了</button>
              <button onclick="cancelWMTimer();wmRateWord(3)" class="px-6 py-3 rounded-xl bg-amber-50 text-amber-600 text-sm font-medium hover:bg-amber-100 transition-colors">🤔 模糊</button>
              <button onclick="cancelWMTimer();wmRateWord(5)" class="px-6 py-3 rounded-xl bg-emerald-50 text-emerald-600 text-sm font-medium hover:bg-emerald-100 transition-colors">😊 记得</button>
            </div>
          </div>`;
          break;
      }

      html += `</div>`;
      // Auto-play and countdown: schedule after DOM renders
      if (step !== 'spell' && !st._timerStarted) {
        st._timerStarted = true;
        setTimeout(() => { wmAutoAdvance(); }, 50);
      }
      return html;
    }

    // Word Machine control functions
    // Clear auto-advance timer
    function cancelWMTimer() {
      if (appState._wmState._timerId) {
        clearTimeout(appState._wmState._timerId);
        appState._wmState._timerId = null;
      }
      if (appState._wmState._countId) {
        clearInterval(appState._wmState._countId);
        appState._wmState._countId = null;
      }
      appState._wmState._countdown = 0;
      appState._wmState._timerStarted = false;
    }

    // Auto-advance: play audio then start countdown
    async function wmAutoAdvance() {
      const st = appState._wmState;
      const session = appState._wmSession;
      if (!session || st.wordIndex >= session.length) return;
      if (st.step === 'spell') return;

      const item = session[st.wordIndex];
      const rawWord = item.word;
      const wordStr = typeof rawWord === 'string' ? rawWord : (rawWord.english || '');
      const wordInfo = typeof rawWord === 'string' ? findWordInfo(rawWord) : { english: rawWord.english || '', chinese: rawWord.chinese || '' };

      // Auto-play audio
      if (wordStr) {
        try { await speakWord(wordStr); } catch(e) {}
      }

      const step = st.step;
      // Determine next step for countdown message
      let nextStepName = '';
      if (step === 'learn') nextStepName = '例句跟读';
      else if (step === 'sentence') nextStepName = '拼写检测';
      else if (step === 'review') nextStepName = '下一个单词';

      // Start countdown: 5 seconds
      st._countdown = 5;
      render();

      st._countId = setInterval(() => {
        st._countdown--;
        if (st._countdown <= 0) {
          clearInterval(st._countId);
          st._countId = null;
          st._countdown = 0;
          st._timerStarted = false;
          // Auto-advance
          if (step === 'review') {
            wmRateWord(3); // Auto-rate as "模糊" for auto-advance
          } else {
            wmNextStep();
          }
        } else {
          // Update countdown display efficiently
          const el = document.getElementById('wm-countdown-timer');
          if (el) el.textContent = '⏱ ' + st._countdown + 's';
        }
      }, 1000);
      st._timerId = st._countId;
    }

      cancelWMTimer();
      const data = ensureWMDefaults();
      const sessionData = prepareWMSession();
      if (sessionData.session.length === 0) {
        alert('今日目标已完成，且没有待复习的单词！\n\n提示：可调整每日目标量或从词库选择更多单词加入学习计划。');
        return;
      }
      // Store session
      appState._wmSession = sessionData.session;
      appState._wmSessionData = sessionData;
      appState._wmState = { step: 'learn', wordIndex: 0, correctCount: 0, totalCount: sessionData.session.length, userInput: '', result: '', isReview: false, _countdown: 0, _timerId: null, _countId: null, _timerStarted: false };
