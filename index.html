    function wmNextStep() {
      cancelWMTimer();
      const steps = ['learn', 'sentence', 'spell', 'review'];
      const curIdx = steps.indexOf(appState._wmState.step);
      if (curIdx < steps.length - 1) {
        appState._wmState.step = steps[curIdx + 1];
        appState._wmState.result = '';
        appState._wmState.userInput = '';
        appState._wmState._timerStarted = false;
        render();
      }
    }

    // Helper: extract word string from session item (review items have string, new items have {english,chinese})
    function getWMWordKey(item) {
      const w = item.word;
      return typeof w === 'string' ? w : (w.english || '');
    }

    function wmCheckSpell() {
      const item = appState._wmSession[appState._wmState.wordIndex];
      const word = getWMWordKey(item);

      if (appState._wmState.result) {
        // Already shown result, now record and advance to review
        const wasCorrect = appState._wmState.result === 'correct';
        if (item.type === 'review') {
          recordWMReview(word, wasCorrect);
        } else {
          recordWMResult(word, wasCorrect);
        }
        appState._wmState.step = 'review';
        appState._wmState.result = '';
        appState._wmState.userInput = '';
        appState._wmState._timerStarted = false;
        render();
      } else {
        // First click: check user input
        const input = (document.getElementById('wm-spell-input')?.value || '').trim();
        if (!input) { document.getElementById('wm-spell-input')?.focus(); return; }
        const correct = input.toLowerCase() === word.toLowerCase();
        appState._wmState.result = correct ? 'correct' : 'wrong';
        appState._wmState.userInput = input;
        if (correct) appState._wmState.correctCount++;
        render();
      }
    }

    function wmRateWord(score) {
      cancelWMTimer();
      const item = appState._wmSession[appState._wmState.wordIndex];
      const word = getWMWordKey(item);
      if (item.type === 'review') {
        recordWMReview(word, score >= 3);

      // Next word
      appState._wmState.wordIndex++;
      appState._wmState.step = 'learn';
      appState._wmState.result = '';
      appState._wmState.userInput = '';
      appState._wmState._timerStarted = false;
      appState._wmState._countdown = 0;
      if (appState._wmState.wordIndex >= appState._wmSession.length) {

        appState._wmState = { step: 'idle' };
        appState._wmSession = null;

    function generateVirtualLeaderboard(userScore, total) {
      const userPct = total > 0 ? Math.round((userScore / total) * 100) : 0;
      // Generate virtual players
      const names = ['词汇达人Leo', '英语学霸Amy', '拼写高手Tom', '单词精灵Mia', '词汇大师Jack',
        'EnglishStar', 'WordKing', 'SpellBee', '记忆超Eva', '学霸小明', '英语小王', '单词侠'];
      const avatars = ['🦁','🦊','🐯','🦄','🐲','🌟','👑','🐝','🧠','📖','✏️','🦸'];
      
      // Use seed based on date so same day shows same rankings
      const today = new Date().toDateString();
      let seed = 0;
      for (let i = 0; i < today.length; i++) seed = ((seed << 5) - seed + today.charCodeAt(i)) | 0;
      const pseudoRandom = () => { seed = (seed * 1103515245 + 12345) | 0; return (seed >>> 0) / 0xFFFFFFFF; };

      // Generate virtual scores around user's score
      const virtualPlayers = [];
      for (let i = 0; i < 8; i++) {
        // Score range: some above, some below user
        const base = userPct + (pseudoRandom() * 40 - 20); // -20 to +20 around user
        const score = Math.max(0, Math.min(100, Math.round(base)));
        const correctCount = Math.round(score / 100 * total);
        virtualPlayers.push({
          name: names[i % names.length],
          avatar: avatars[i % avatars.length],
          score: score,
          correct: correctCount,
          total: total
        });
      }

      // Add user
      virtualPlayers.push({
        name: '你',
        avatar: '⭐',
        score: userPct,
        correct: userScore,
        total: total,
        isUser: true
      });

      // Sort by score descending
      virtualPlayers.sort((a, b) => b.score - a.score);

      // Assign ranks (handle ties)
      let rank = 1;
      let prevScore = -1;
      virtualPlayers.forEach((p, i) => {
        if (p.score !== prevScore) rank = i + 1;
        p.rank = rank;
        prevScore = p.score;
      });

      let html = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mt-3 text-left">
        <p class="text-sm font-semibold text-slate-700 mb-3">🏅 排行榜</p>`;
      
      virtualPlayers.forEach(p => {
        const isUser = p.isUser;
        const rankMedal = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : `${p.rank}`;
        html += `<div class="flex items-center gap-3 py-2 ${isUser ? 'bg-blue-50 rounded-lg px-2 -mx-2' : ''}">
          <span class="w-8 text-center font-bold ${p.rank <= 3 ? 'text-lg' : 'text-sm text-slate-400'}">${rankMedal}</span>
          <span class="text-lg">${p.avatar}</span>
          <span class="flex-1 text-sm font-medium ${isUser ? 'text-[#4F8CFF]' : 'text-slate-700'}">${escapeHtml(p.name)}</span>
          <span class="text-sm font-bold ${isUser ? 'text-[#4F8CFF]' : 'text-slate-600'}">${p.score}%</span>
          <span class="text-xs text-slate-400">${p.correct}/${p.total}</span>
        </div>`;
      });

      html += `</div>`;
      return html;
    }

    // ==================== PK LOGIC ====================
    function startPk() {
      const words = appState.words;

        return;
      }
      startPkWith('all');

    function startPkWith(source) {
      let pool = [];
      if (source === 'wrong') {
        pool = getWrongWords().map(w => ({ english: w.english, chinese: w.chinese }));
      } else {
        pool = [...appState.words];
      }
      if (pool.length < 2) {
        showToast('至少需要2个单词才能开始PK', 'warning');
        return;
      }

      // Shuffle words
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      appState.pkWords = shuffled;
      appState.pkIndex = 0;
      appState.pkScore = 0;
      appState.pkTotal = Math.min(shuffled.length, 30); // max 30 questions
      appState.pkMode = 'cn';
      appState.pkAnswered = false;
      appState.pkCorrectIndex = -1;
      appState.pkReacted = false;
      generatePkOptions();
      appState.currentPage = 'pk';
      render();
    }

    function generatePkOptions() {
      const { pkWords, pkIndex, pkMode } = appState;
      if (pkIndex >= pkWords.length) return;

      const correct = pkWords[pkIndex];
      const allWords = appState.words.length >= 4 ? appState.words : pkWords;

      // Get 3 random wrong options (different from correct)
      const others = allWords.filter(w =>
        w.english.toLowerCase() !== correct.english.toLowerCase()
      );
      const shuffled = [...others].sort(() => Math.random() - 0.5);
      const wrongOptions = shuffled.slice(0, 3);

      // Create options array with correct at random position
      const correctText = pkMode === 'cn' ? correct.chinese : correct.english;
      const wrongTexts = wrongOptions.map(w => pkMode === 'cn' ? w.chinese : w.english);

      // Build options array
      const options = [...wrongTexts, correctText];
      // Shuffle
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      appState.pkOptions = options;
      appState.pkCorrectIndex = options.indexOf(correctText);
      appState.pkAnswered = false;
    }

    function answerPk(selectedIndex) {
      if (appState.pkAnswered) return;
      appState.pkAnswered = true;

      if (selectedIndex === appState.pkCorrectIndex) {
        appState.pkScore++;
      }

      render();
    }

    function nextPk() {
      appState.pkIndex++;
      if (appState.pkIndex >= appState.pkTotal) {
        render();
        return;
      }
      generatePkOptions();
      render();
    }

    function quitPk() {
      appState.pkWords = [];

        el.style.top = assistantState.y + 'px';
        el.style.right = 'auto';
        el.style.bottom = 'auto';

        const rect = el.getBoundingClientRect();
        assistantState.dragOffset = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        if (assistantState.x === null) {
          assistantState.x = rect.left;
          assistantState.y = rect.top;
        }
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (!assistantState.dragging) return;
        e.preventDefault();
        assistantState.x = e.touches[0].clientX - assistantState.dragOffset.x;
        assistantState.y = e.touches[0].clientY - assistantState.dragOffset.y;
        el.style.left = assistantState.x + 'px';
        el.style.top = assistantState.y + 'px';
        el.style.right = 'auto';
        el.style.bottom = 'auto';
      }, { passive: false });

      document.addEventListener('touchend', () => {
        if (assistantState.dragging) {
          assistantState.dragging = false;
          el.classList.remove('dragging');
          saveAssistant();
        }
      });
    }

    function toggleSwitcher() {
      const sw = document.getElementById('assistant-switcher');
      if (sw) sw.classList.toggle('show');
    }

    function switchAssistant(key) {
      assistantState.character = key;
      saveAssistant();
      renderAssistant();
      showSpeechBubble('你好！我是' + ASSISTANT_CHARS[key].name + ' 🎉', 2000);
    }

    function minimizeAssistant() {
      assistantState.minimized = true;
      saveAssistant();
      renderAssistant();
    }

    function showAssistant() {
      assistantState.minimized = false;
      saveAssistant();
      renderAssistant();
    }

    function onAssistantClick() {
      const wasDragging = assistantState.dragging;
      // Don't show bubble if we were just dragging
      setTimeout(() => {
        if (assistantState.dragging) return;
        const body = document.getElementById('assistant-body');
        if (body) {
          body.className = 'assistant-body pop';
          setTimeout(() => { if (body) body.className = 'assistant-body idle'; }, 400);
        }
        const tip = STUDY_TIPS[Math.floor(Math.random() * STUDY_TIPS.length)];
        showSpeechBubble(tip, 3000);
      }, 50);
    }

    function showSpeechBubble(text, duration) {
      const bubble = document.getElementById('assistant-bubble');
      if (!bubble) return;
      if (assistantState.bubbleTimer) clearTimeout(assistantState.bubbleTimer);
      bubble.textContent = text;
      bubble.className = 'speech-bubble show';
      if (duration) {
        assistantState.bubbleTimer = setTimeout(() => {
          bubble.className = 'speech-bubble';
        }, duration);
      }
    }

    function assistantReact(type) {
      const body = document.getElementById('assistant-body');
      if (!body) return;

      if (type === 'correct') {
        body.className = 'assistant-body happy';
        setTimeout(() => { if (body) body.className = 'assistant-body idle'; }, 600);
        showSpeechBubble('答对了！太厉害了！🎉', 2500);
      } else if (type === 'wrong') {
        body.className = 'assistant-body pop';
        setTimeout(() => { if (body) body.className = 'assistant-body idle'; }, 400);
        const tips = ['没关系，下次一定对！💪', '记住这个词的拼写哦 ✍️', '再试试看～', '多练几次就记住了！'];
        showSpeechBubble(tips[Math.floor(Math.random() * tips.length)], 2500);
      } else if (type === 'complete') {
        const records = getPracticeRecords();
        const last = records[records.length - 1];
        if (last) {
          const pct = Math.round((last.correctWords / last.totalWords) * 100);
          if (pct >= 90) {
            showSpeechBubble('你是词汇大师！🏆 正确率' + pct + '%', 4000);
          } else if (pct >= 70) {
            showSpeechBubble('表现不错！正确率' + pct + '% 👍', 3000);
          } else {
            showSpeechBubble('继续加油！正确率' + pct + '% 💪', 3000);
          }
          const body = document.getElementById('assistant-body');
          if (body) {
            body.className = 'assistant-body happy';
            setTimeout(() => { if (body) body.className = 'assistant-body idle'; }, 600);
          }
        }
      }
    }

    // Expose to global for inline onclick
    window.switchAssistant = switchAssistant;
    window.showAssistant = showAssistant;
    window.onAssistantClick = onAssistantClick;
    window.toggleSwitcher = toggleSwitcher;
    window.minimizeAssistant = minimizeAssistant;
    window.assistantReact = assistantReact;

    // Initialize assistant on load
    renderAssistant();
  </script>
</body>
</html>
